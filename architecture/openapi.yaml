openapi: "3.1.0"

info:
  title: "Servicio de Reservas API"
  version: "1.0.0"
  description: |
    Servicio de Reservas expone la API REST de disponibilidad, reserva y cancelación de salas y aplica sus reglas.
    Concentra las reglas de reserva de las 42 salas de las 3 sedes y es la única puerta a sus datos (ADR-003).
    Contrato OpenAPI 3.1 gobernado por ADR-001; la versión mayor va en la ruta, `/v1`.
  contact:
    name: "Equipo de Arquitectura Northwind"
  # TODO: Add license if required by your organization

servers:
  # La URL base documentada es `/v1`; cada ruta de `paths` ya incluye el prefijo `/v1`.
  - url: "/"
    description: "Detrás del ingress del clúster de Plataforma Northwind (ADR-005)"
    # TODO: [NOT DOCUMENTED — host del servicio: add to docs/components/reservas-de-salas-northwind/02-servicio-de-reservas.md]

security:
  - bearerAuth: []

paths:
  /v1/availability:
    get:
      summary: "Consultar disponibilidad (CU1)"
      operationId: getAvailability
      tags:
        - "Servicio de Reservas"
      parameters:
        # TODO: [NOT DOCUMENTED — obligatoriedad de site, date, start y end: add to docs/components/reservas-de-salas-northwind/02-servicio-de-reservas.md]
        - name: site
          in: query
          description: "Sede."
          schema:
            type: string
            enum: [centro, norte, puerto]
        - name: date
          in: query
          description: "Fecha ISO 8601."
          schema:
            type: string
            format: date
        - name: start
          in: query
          description: "Hora de inicio `HH:mm`, en múltiplos de 30 minutos; duración de 8 horas o menos."
          schema:
            type: string
        - name: end
          in: query
          description: "Hora de fin `HH:mm`, en múltiplos de 30 minutos; duración de 8 horas o menos."
          schema:
            type: string
      responses:
        '200':
          description: "Disponibilidad de salas por sede, fecha y franja."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/bookings:
    post:
      summary: "Crear reserva (CU2)"
      operationId: createBooking
      tags:
        - "Servicio de Reservas"
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: "UUID v4 generado en el navegador por cada confirmación (ADR-103). La misma clave en 24 horas devuelve la respuesta guardada."
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '201':
          description: "Reserva confirmada. La misma clave en 24 horas devuelve la respuesta guardada."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: "`ROOM_OCCUPIED` (sala ocupada, ADR-102) o `DAILY_LIMIT_REACHED` (límite diario: 3 reservas futuras ese día)."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      summary: "Listar reservas (CU3: Mis reservas y Reservas de la sede)"
      operationId: listBookings
      description: "Reservas futuras: las propias, o las de la `sede` del token con rol `recepcion` (ADR-105)."
      tags:
        - "Servicio de Reservas"
      parameters:
        - name: scope
          in: query
          required: false
          description: "`site` lista las reservas de la sede del token con rol `recepcion`."
          schema:
            type: string
            enum: [site]
      responses:
        '200':
          description: "Lista de `Booking` futuras."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/bookings/{code}/cancel:
    post:
      summary: "Cancelar reserva (CU3)"
      operationId: cancelBooking
      description: "El dueño de la reserva, o un token con rol `recepcion` de la misma `sede` (ADR-105), la cancela."
      tags:
        - "Servicio de Reservas"
      parameters:
        - name: code
          in: path
          required: true
          description: "Código de la reserva (`RS-` seguido de 8 caracteres alfanuméricos)."
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancellationRequest'
      responses:
        '200':
          description: "Reserva con `status: cancelled`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: "`FORBIDDEN`: reserva ajena sin rol `recepcion` de la misma `sede` (ADR-105)."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: "`BOOKING_NOT_FOUND`: código de reserva inexistente."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: "`BOOKING_IN_PROGRESS`: reserva en curso (CU3, ADR-105)."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT del Proveedor de Identidad Northwind en `Authorization: Bearer` (ADR-002)."

  responses:
    Unauthenticated:
      description: "`UNAUTHENTICATED`: token ausente, inválido o expirado (ADR-002)."
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: "`VALIDATION_FAILED`: franja fuera de múltiplos de 30 minutos, de más de 8 horas o en el pasado; asunto de más de 80 caracteres; motivo de más de 120 caracteres o ausente para `recepcion`."
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: "Error RFC 9457 (`application/problem+json`) con el campo `code` (ADR-001)."
      # TODO: [NOT DOCUMENTED — campos del problem además de `code` (type, title, status, detail): add to docs/components/reservas-de-salas-northwind/02-servicio-de-reservas.md]
      properties:
        code:
          type: string
          enum:
            - UNAUTHENTICATED
            - FORBIDDEN
            - VALIDATION_FAILED
            - BOOKING_NOT_FOUND
            - ROOM_OCCUPIED
            - DAILY_LIMIT_REACHED
            - BOOKING_IN_PROGRESS
    AvailabilityResponse:
      type: object
      properties:
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/RoomAvailability'
        suggestedSlots:
          type: array
          maxItems: 3
          description: "Hasta 3 franjas cuando no hay salas libres (CU1, alternativa 1)."
          items:
            type: object
            properties:
              start:
                type: string
                description: "`HH:mm`."
              end:
                type: string
                description: "`HH:mm`."
    RoomAvailability:
      type: object
      properties:
        roomId:
          type: string
          description: "Identificador opaco."
        name:
          type: string
        capacity:
          type: integer
        equipment:
          type: array
          items:
            type: string
            enum: [screen, videoconference, whiteboard]
        status:
          type: string
          enum: [free, occupied]
    BookingRequest:
      type: object
      required:
        - roomId
        - date
        - start
        - end
        - subject
      properties:
        roomId:
          type: string
          description: "Identificador opaco."
        date:
          type: string
          format: date
        start:
          type: string
          description: "`HH:mm`."
        end:
          type: string
          description: "`HH:mm`."
        subject:
          type: string
          maxLength: 80
    Booking:
      type: object
      required:
        - code
        - roomId
        - site
        - date
        - start
        - end
        - subject
        - memberId
        - status
      properties:
        code:
          type: string
          description: "`RS-` seguido de 8 caracteres alfanuméricos."
        roomId:
          type: string
          description: "Identificador opaco."
        site:
          # TODO: [NOT DOCUMENTED — type of site en Booking: add to docs/components/reservas-de-salas-northwind/02-servicio-de-reservas.md]
          description: "Sede de la reserva."
        date:
          type: string
          format: date
        start:
          type: string
          description: "`HH:mm`."
        end:
          type: string
          description: "`HH:mm`."
        subject:
          type: string
          maxLength: 80
        memberId:
          type: string
          description: "`sub` del JWT del Proveedor de Identidad Northwind (ADR-002)."
        status:
          type: string
          enum: [confirmed, cancelled]
        cancelledBy:
          type: string
          description: "`sub` del JWT; solo con `status: cancelled`."
        cancelledAt:
          type: string
          format: date-time
          description: "Solo con `status: cancelled`."
        cancellationReason:
          type: string
          maxLength: 120
          description: "Solo con `status: cancelled`."
    CancellationRequest:
      type: object
      description: "Cuerpo opcional para el dueño; `reason` obligatorio para el rol `recepcion` (ADR-105)."
      properties:
        reason:
          type: string
          maxLength: 120
