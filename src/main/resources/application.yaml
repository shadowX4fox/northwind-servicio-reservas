# Servicio de Reservas — arquitectura Reservas de Salas Northwind 1.3.0.
# Lo que la arquitectura no documenta no tiene valor por defecto: el despliegue lo da o el servicio no arranca.

spring:
  application:
    name: Servicio de Reservas
  datasource:
    # ADR-003 y ADR-005: PostgreSQL 16 por JDBC con TLS; credenciales del gestor de secretos del clúster.
    url: ${RESERVAS_DB_URL}
    username: ${RESERVAS_DB_USUARIO}
    password: ${RESERVAS_DB_CLAVE}
    hikari:
      # TODO(architecture): tamaño del pool y límite de conexiones no documentados — security T11-D.
      data-source-properties:
        sslmode: ${RESERVAS_DB_SSLMODE:verify-full}
  jackson:
    # `cancelledBy`, `cancelledAt` y `cancellationReason` aparecen solo con `status: cancelled`.
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false

server:
  port: 8080
  shutdown: graceful

management:
  # ADR-005: sondas de vida y disponibilidad, fuera del puerto de la API.
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  # ADR-004: trazas y métricas por OTLP hacia el colector de Plataforma Northwind. Los endpoints los da
  # el despliegue (MANAGEMENT_OTLP_TRACING_ENDPOINT, MANAGEMENT_OTLP_METRICS_EXPORT_URL); el recurso
  # `service.name` es spring.application.name. Las métricas RED por operación son http.server.requests.
  # TODO(architecture): probabilidad de muestreo de trazas no documentada; se usa la de Spring Boot.

reservas:
  # TODO(architecture): zona horaria de las sedes no documentada (spec § 4, INV-01 e INV-04).
  zona-horaria: ${RESERVAS_ZONA_HORARIA}
  token:
    jwk-set-uri: ${RESERVAS_JWKS_URI}
    # TODO(architecture): claims del rol `recepcion`, del atributo `sede` y del llamador no documentados (ADR-105; security § Entrada).
    claim-roles: ${RESERVAS_CLAIM_ROLES}
    claim-sede: ${RESERVAS_CLAIM_SEDE}
    claim-cliente: ${RESERVAS_CLAIM_CLIENTE}
    clientes-permitidos: ${RESERVAS_CLIENTES_PERMITIDOS}
